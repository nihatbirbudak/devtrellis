<!-- Özel başvuru ve destek taleplerini yalnız oturum açmış moderatöre gösterir. -->
<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>DevTrellis — Başvuru ve destek kutusu</title><link rel="icon" href="/static/ufuk.svg"><link rel="stylesheet" href="/static/platform.css"><link rel="stylesheet" href="/static/community.css"><link rel="stylesheet" href="/static/community-requests.css"><script src="/static/ui-text.js" defer></script><script src="/static/community-requests.js" defer></script></head>
<body><a class="skip-link" href="#requests-main">İçeriğe geç</a><header class="site-header"><a class="brand" href="/"><img src="/static/ufuk.svg" width="42" height="42" alt=""><span>DevTrellis<small>Topluluk</small></span></a><label class="language-label"><span>Dil</span><select data-language aria-label="Dil"><option value="en">EN</option><option value="tr">TR</option></select></label></header>
<main id="requests-main" tabindex="-1"><h1>Başvuru ve destek kutusu</h1><p>Bu talepler özeldir. İletişim bilgilerini kamuya açık araştırmalara veya model istemlerine taşımayın.</p><p><a href="/">Ana sayfa ve moderatör girişi</a></p><p id="requests-notice" role="status" aria-live="polite"></p>
<section id="requests-workspace" hidden><form id="requests-filter" class="filters"><label for="requests-state">Durum</label><select id="requests-state"><option value="new">Yeni</option><option value="in_review">İnceleniyor</option><option value="closed">Kapalı</option><option value="">Tümü</option></select><button type="submit" class="button">Listeyi yenile</button></form><p id="requests-count" role="status"></p><div id="requests-list" aria-busy="false"></div><nav class="pagination" aria-label="Talep sayfaları"><button id="requests-prev" type="button" class="button secondary">Önceki</button><button id="requests-next" type="button" class="button secondary">Sonraki</button></nav></section>
<section id="request-detail" class="panel" hidden aria-labelledby="request-title"><h2 id="request-title" tabindex="-1"></h2><dl id="request-facts"></dl><h3>Mesaj</h3><p id="request-message"></p><form id="request-status-form"><label for="request-status">Talep durumu</label><select id="request-status"><option value="new">Yeni</option><option value="in_review">İnceleniyor</option><option value="closed">Kapalı</option></select><button id="request-save" type="submit" class="button">Durumu kaydet</button></form><p>Durum değişikliği e-posta göndermez. Yanıt gerekiyorsa kişinin verdiği iletişim adresini kullanın.</p></section></main></body></html>
